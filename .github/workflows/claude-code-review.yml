# Claude reviews each PR and posts inline comments (or one summary comment when it finds nothing).
# Skips drafts, closed PRs, and PRs it already commented on. Uses the CLAUDE_CODE_OAUTH_TOKEN repo secret.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          # OAuth token from a Claude Pro/Max plan (`claude setup-token`); API-key usage of Claude Code is blocked for the org (see out/investigations/2026-11-04-claude-ci-billing-error.md).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # TEMPORARY: show Claude's real error in the (public) log; remove once the review works.
          show_full_output: true
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
